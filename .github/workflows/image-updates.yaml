# PR из ветки обновлений образов прода: образ попадает в прод только после merge.
name: image-updates

on:
  push:
    branches:
      - flux/image-updates-*

permissions:
  contents: read
  pull-requests: write

jobs:
  pull-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Open or update PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]]; then
            echo "PR для $BRANCH уже открыт — новый коммит в нём"
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "$(git log -1 --format=%s)" \
            --body "$(git log -1 --format=%b)"
