fullnameOverride: example-app

image:
  repository: ghcr.io/stefanprodan/podinfo
  # Тег правит ImageUpdateAutomation (image-automation.yaml) по маркеру.
  tag: 6.17.0 # {"$imagepolicy": "example-dev:example-app:tag"}

cache: tcp://example-app-redis:6379

replicaCount: 1

ui:
  message: dev

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
