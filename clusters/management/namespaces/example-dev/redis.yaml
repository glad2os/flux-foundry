apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: example-app-redis
  annotations:
    # Удаление из git не удаляет Redis и PVC.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  kubernetesConfig:
    image: quay.io/opstree/redis:v8.10.1
    imagePullPolicy: IfNotPresent
    service:
      serviceType: ClusterIP
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

  # Метрики redis_*. Правка блока перезапускает Redis.
  redisExporter:
    enabled: true
    image: docker.io/oliver006/redis_exporter:v1.96.0
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000

  storage:
    keepAfterDelete: true
    volumeClaimTemplate:
      spec:
        storageClassName: local-path-retain
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
