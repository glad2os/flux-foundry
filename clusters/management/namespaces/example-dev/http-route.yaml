apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-app
spec:
  parentRefs:
    - name: internal
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - example.mgmt.internal.example.com
  rules:
    - backendRefs:
        - name: example-app
          port: 9898
