# Dev: новые теги коммитятся прямо в main. Деплой-ключу нужен push (--read-write-key).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: example-dev
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.example.com
      messageTemplate: |
        example-dev: образы
        {{ range .Changed.Changes }}
        - {{ .OldValue }} → {{ .NewValue }}
        {{ end }}
    push:
      branch: main
  update:
    path: ./clusters/management/namespaces/example-dev
    strategy: Setters
---
# Выбор тега для автовыкатки; тег в git правит ImageUpdateAutomation кластера по маркеру $imagepolicy.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: example-app
spec:
  image: ghcr.io/stefanprodan/podinfo
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: example-app
spec:
  imageRepositoryRef:
    name: example-app
  # Только релизные теги: в реестре есть ещё latest, sha-… и подписи.
  filterTags:
    pattern: '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=6.0.0 <7.0.0'
