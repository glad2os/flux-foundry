# Redis без пароля: к Redis и Postgres пускаем только поды приложения и операторы.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: example-app-redis
spec:
  podSelector:
    matchLabels:
      app: example-app-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: example-app
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redis-operator
      ports:
        - port: 6379
          protocol: TCP
    # Метрики redis_exporter для VMAgent.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vm-operator
      ports:
        - port: 9121
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: example-app-postgres
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: example-app-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: example-app
      ports:
        - port: 5432
          protocol: TCP
    # Метрики инстанса для VMAgent.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vm-operator
      ports:
        - port: 9187
          protocol: TCP
    # Оператор (status API 8000, БД) и реплики между собой.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
        - podSelector:
            matchLabels:
              cnpg.io/cluster: example-app-postgres
      ports:
        - port: 8000
          protocol: TCP
        - port: 5432
          protocol: TCP
