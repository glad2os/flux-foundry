apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
automountServiceAccountToken: false
---
# Конфиг Alertmanager собирает VSO из Vault kv/vm-operator/alertmanager/telegram (ключи chat_id и bot_token):
# куда слать алерты — тоже данные команды, в git только шаблон. Смену значений оператор подхватывает сам.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: alertmanager-config
spec:
  type: kv-v2
  mount: kv
  path: vm-operator/alertmanager/telegram
  refreshAfter: 5m
  destination:
    name: alertmanager-config
    type: Opaque
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        alertmanager.yaml:
          text: |
            global:
              resolve_timeout: 5m
            route:
              receiver: telegram
              # cluster — в группировке, чтобы имя кластера было в заголовке сообщения.
              group_by: [cluster, alertname, namespace, pod]
              group_wait: 10s
              group_interval: 1m
              repeat_interval: 24h
            receivers:
              - name: telegram
                telegram_configs:
                  - chat_id: {{ get .Secrets "chat_id" }}
                    bot_token: {{ get .Secrets "bot_token" | quote }}
                    send_resolved: true
                    parse_mode: HTML
---
# Токены workload; те же значения — в Vault workload у агентов.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vmauth-workload-metrics
spec:
  type: kv-v2
  mount: kv
  path: vm-operator/vmauth/workload-metrics
  refreshAfter: 5m
  destination:
    name: vmauth-workload-metrics
    type: Opaque
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      includes:
        - ^token$
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vmauth-workload-logs
spec:
  type: kv-v2
  mount: kv
  path: vm-operator/vmauth/workload-logs
  refreshAfter: 5m
  destination:
    name: vmauth-workload-logs
    type: Opaque
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      includes:
        - ^token$
