# Envoy перечитывает Secret сам — рестарт после продления не нужен.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-wildcard
spec:
  secretName: internal-wildcard-tls
  dnsNames:
    - "*.mgmt.internal.example.com"
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - digital signature
  issuerRef:
    kind: ClusterIssuer
    name: internal-ca
