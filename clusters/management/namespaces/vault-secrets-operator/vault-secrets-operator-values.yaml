controller:
  manager:
    image:
      repository: docker.io/hashicorp/vault-secrets-operator
      tag: 1.6.2@sha256:8f77bc42ac47a4a1b2d1bb8b3a398fc53c19b3ce626002824a87ceb6cf91e5ad
  kubeRbacProxy:
    image:
      repository: quay.io/brancz/kube-rbac-proxy
      tag: v0.18.1
  # Для PSS restricted: seccomp и drop ALL.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# CRD — из crds/.
hooks:
  upgradeCRDs:
    enabled: false

defaultVaultConnection:
  enabled: true
  address: http://vault.vault.svc.cluster.local:8200

# Вход ServiceAccount'ом vault-auth из namespace ресурса. Роль и политику kv/<namespace>/* заводят в Vault заранее.
defaultAuthMethod:
  enabled: true
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vault-auth
    serviceAccount: vault-auth

# У пода helm test не задан тег образа.
tests:
  enabled: false
