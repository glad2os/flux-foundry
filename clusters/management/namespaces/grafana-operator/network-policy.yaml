# Чарт открывает pprof (8888) без отключения, а оператор кэширует Secret'ы Grafana — пускаем только на метрики.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-operator
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9090
          protocol: TCP
---
# Только Envoy Gateway и оператор.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana-operator
      ports:
        - port: 3000
          protocol: TCP
