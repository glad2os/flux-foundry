# Вход через OIDC: роль — из claim groups, без нужной группы вход запрещён. Адреса провайдера и группы — свои.
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: grafana
spec:
  version: docker.io/grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
  config:
    server:
      domain: grafana.mgmt.internal.example.com
      root_url: https://grafana.mgmt.internal.example.com/
    auth:
      signout_redirect_url: https://id.example.com/realms/platform/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=https%3A%2F%2Fgrafana.mgmt.internal.example.com%2Flogin
    # client_secret — env GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET (Secret из vault-secrets.yaml).
    auth.generic_oauth:
      enabled: "true"
      name: SSO
      client_id: grafana
      scopes: openid profile email groups
      auth_url: https://id.example.com/realms/platform/protocol/openid-connect/auth
      token_url: https://id.example.com/realms/platform/protocol/openid-connect/token
      api_url: https://id.example.com/realms/platform/protocol/openid-connect/userinfo
      login_attribute_path: preferred_username
      name_attribute_path: name
      email_attribute_path: email
      role_attribute_path: "contains(groups[*], 'platform-admins') && 'GrafanaAdmin' || contains(groups[*], 'platform-users') && 'Viewer'"
      role_attribute_strict: "true"
      allow_assign_grafana_admin: "true"
      allow_sign_up: "true"
      auto_login: "false"
      use_pkce: "true"
      use_refresh_token: "true"
    security:
      cookie_secure: "true"
    analytics:
      reporting_enabled: "false"
      check_for_updates: "false"
      check_for_plugin_updates: "false"
    users:
      allow_sign_up: "false"
    # Автообновление плагинов ломается на read-only rootfs.
    plugins:
      preinstall_auto_update: "false"

  deployment:
    spec:
      # SQLite на RWO-томе: два пода нельзя.
      strategy:
        type: Recreate
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana
        spec:
          # Для PSS restricted не хватает только seccompProfile.
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          # Иначе оператор монтирует emptyDir.
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
          containers:
            - name: grafana
              env:
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oidc-credentials
                      key: client_secret
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 1Gi

  # Настройки и дашборды из UI — в SQLite; Retain сохраняет их при удалении PVC.
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: local-path-retain
      resources:
        requests:
          storage: 2Gi

  service:
    spec:
      type: ClusterIP
