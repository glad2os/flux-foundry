apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
automountServiceAccountToken: false
---
# Deployment ведёт оператор: после смены секрета — rollout restart вручную.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-oidc-credentials
spec:
  type: kv-v2
  mount: kv
  path: grafana-operator/grafana/oidc
  refreshAfter: 5m
  destination:
    name: grafana-oidc-credentials
    type: Opaque
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      includes:
        - ^client_secret$
