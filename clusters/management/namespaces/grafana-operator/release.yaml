# CRD — из crds/.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
spec:
  interval: 10m
  timeout: 10m
  releaseName: grafana-operator
  chart:
    spec:
      chart: grafana-operator
      version: 5.25.0
      sourceRef:
        kind: HelmRepository
        name: grafana
      interval: 1h
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: grafana-operator-values
