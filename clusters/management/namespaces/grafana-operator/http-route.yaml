apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: internal
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - grafana.mgmt.internal.example.com
  rules:
    - backendRefs:
        - name: grafana-service
          port: 3000
