# Secret'ы из Vault kv/<namespace>/example-app/* (политика vault-auth пускает namespace только в свой путь);
# в Secret попадают только ключи из includes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
automountServiceAccountToken: false
---
# CNPG читает пароль только при bootstrap: смена в Vault роль в БД не меняет (нужен ALTER ROLE).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: example-app-postgres-credentials
spec:
  type: kv-v2
  mount: kv
  path: example/example-app/postgres
  refreshAfter: 5m
  destination:
    name: example-app-postgres-credentials
    type: kubernetes.io/basic-auth
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      includes:
        - ^username$
        - ^password$
  # Если приложение читает пароль из env:
  # rolloutRestartTargets:
  #   - kind: Deployment
  #     name: example-app
