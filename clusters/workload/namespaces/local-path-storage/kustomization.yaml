apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # rancher/local-path-provisioner v0.0.37 без правок. Если дистрибутив ставит свой — уберите компонент.
  - local-path-storage.yaml
  - storageclass-retain.yaml
patches:
  # Удаление из git не должно снести провижинер.
  - target:
      kind: Namespace
      name: local-path-storage
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          kustomize.toolkit.fluxcd.io/prune: disabled
