# CRD — из crds/, чарт их не ставит.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-operator
spec:
  interval: 15m
  timeout: 5m
  releaseName: redis-operator
  chart:
    spec:
      chart: redis-operator
      version: 0.27.0
      sourceRef:
        kind: HelmRepository
        name: ot-container-kit
      interval: 1h
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: redis-operator-values
