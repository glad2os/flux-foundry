# Из Vault workload: токен VMUser <кластер>-logs и корень внутреннего CA (README, «Подключить spoke к хабу»).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: vlagent-remote-write-management
spec:
  type: kv-v2
  mount: kv
  path: vlagent/remote-write-management
  refreshAfter: 5m
  destination:
    name: vlagent-remote-write-management
    type: Opaque
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      includes:
        - ^token$
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: internal-ca
spec:
  type: kv-v2
  mount: kv
  path: vlagent/internal-ca
  refreshAfter: 1h
  destination:
    name: internal-ca
    type: Opaque
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      includes:
        - ^ca\.crt$
