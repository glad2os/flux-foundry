# Только https и TCP для БД: один порт — одна БД (у TCP нет имени хоста).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: internal
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.prod.internal.example.com"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.platform/internal: "true"
      tls:
        mode: Terminate
        certificateRefs:
          - name: prod-internal-wildcard-tls
    - name: example-postgres
      protocol: TCP
      port: 5432
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: example
