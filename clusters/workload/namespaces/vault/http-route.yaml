# Service ведёт и на запечатанные поды — UI годится для unseal.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault
spec:
  parentRefs:
    - name: internal
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - vault.prod.internal.example.com
  rules:
    - backendRefs:
        - name: vault
          port: 8200
    # Метрики без токена — только изнутри кластера.
    - matches:
        - path:
            type: PathPrefix
            value: /v1/sys/metrics
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: vault-metrics-deny
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: vault-metrics-deny
spec:
  directResponse:
    statusCode: 404
    contentType: text/plain
    body:
      type: Inline
      inline: "not found\n"
