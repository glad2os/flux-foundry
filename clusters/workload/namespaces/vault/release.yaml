# OnDelete: после смены образа под удаляют и распечатывают вручную.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
spec:
  interval: 10m
  timeout: 10m
  releaseName: vault
  chart:
    spec:
      chart: vault
      version: 0.34.1
      sourceRef:
        kind: HelmRepository
        name: hashicorp
      interval: 1h
  # Под не Ready до init и unseal — ожидание уронило бы первую установку.
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: vault-values
