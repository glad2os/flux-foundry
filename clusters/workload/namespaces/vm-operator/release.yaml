# CRD — из crds/.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm-operator
spec:
  interval: 10m
  timeout: 10m
  releaseName: vm-operator
  chart:
    spec:
      chart: victoria-metrics-operator
      version: 0.68.2
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
      interval: 1h
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: vm-operator-values
