apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vm-operator
resources:
  - namespace.yaml
  - helm-repository.yaml
  - release.yaml
  - vault-secrets.yaml
  - vmsingle.yaml
  - vmagent.yaml
  - vmalert.yaml
  - vmalertmanager.yaml
  - vmnodescrape-cadvisor.yaml
configMapGenerator:
  - name: vm-operator-values
    files:
      - values.yaml=vm-operator-values.yaml
configurations:
  - kustomizeconfig.yaml
