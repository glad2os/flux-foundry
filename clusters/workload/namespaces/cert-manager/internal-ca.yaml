# Промежуточный CA от хаба; ключ приходит из Vault этого кластера, ключа корня здесь нет.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: intermediate-ca
spec:
  type: kv-v2
  mount: kv
  path: cert-manager/intermediate-ca
  refreshAfter: 1h
  destination:
    name: intermediate-ca
    type: kubernetes.io/tls
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      includes:
        - ^tls\.crt$
        - ^tls\.key$
        - ^ca\.crt$
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: intermediate-ca
